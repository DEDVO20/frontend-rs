server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Assets con hash de Vite: caché larga
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html nunca en caché, para que los despliegues se vean al instante
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA: cualquier ruta del router cae en index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
